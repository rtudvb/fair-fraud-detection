name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[gbdt,explain,app,dev]"
      - name: Lint
        run: |
          ruff check src tests app
          ruff format --check src tests app
      - name: Unit tests
        run: pytest -m "not slow" --cov=frauddetect --cov-report=term-missing
      - name: Pipeline check (all experiments on synthetic data)
        run: python -m frauddetect run all --synthetic --quick --models logreg lightgbm
