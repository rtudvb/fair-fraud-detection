# Default-parameter track (proposal §6.4): library defaults, plus only the technical settings
# needed to run (iterations, threads, logging). The tuned track lives in separate configs.
models:
  # Classical machine learning
  logreg:
    family: classical
    params: { max_iter: 2000 }
  random_forest:
    family: classical
    params: { n_jobs: -1 }
  xgboost:
    family: classical
    params: { tree_method: hist, n_jobs: -1 }
  lightgbm:
    family: classical
    params: { n_jobs: -1, verbose: -1 }
  catboost:
    family: classical
    params: { verbose: 0, thread_count: -1 }

  # Deep learning trained from scratch
  mlp:
    family: deep_learning
    params: { early_stopping: true, max_iter: 200 }
  tabm:
    family: deep_learning
    params: {}
  realmlp:
    family: deep_learning
    params: {}

  # Pretrained tabular foundation models (no tuning by design)
  tabpfn:
    family: foundation
    params: {}
  tabicl:
    family: foundation
    params: {}
