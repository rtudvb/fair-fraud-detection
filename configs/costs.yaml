# Three-tier decision model (proposal §6.7).
# Every number below is an ASSUMPTION for a scenario simulation, not data from a real bank.
# Results are reported with the sensitivity grid at the bottom.
currency: TWD

tier_costs:
  # Expected loss when a fraudulent account opens with full functionality.
  # Proxy: monthly non-designated transfer limit of a type-1 digital account (NT$200,000).
  loss_full: 200000
  # Expected loss when it opens as a limited (type-3) account: monthly limit NT$50,000.
  loss_limited: 50000
  verify_catch: 0.5 # probability that enhanced verification (video / telecom) stops a fraudster
  review_catch: 0.9 # probability that manual review stops a fraudster
  cost_verify: 50 # operating cost per enhanced verification
  cost_review: 300 # operating cost per manual review
  cost_friction: 100 # inconvenience cost for a legitimate applicant sent to tier 2
  cost_attrition: 2000 # expected lost customer value for a legitimate applicant sent to tier 3

constraints:
  review_capacity_rate: 0.02 # at most 2% of applications may go to manual review (tier 3)
  # At most 10% may go to enhanced verification (tier 2): video / telecom checks need staff
  # and slow down onboarding. Without this cap, cheap verification makes "verify everyone"
  # the cheapest policy and the model irrelevant (see the all_limited reference policy).
  verify_capacity_rate: 0.10
  min_fpr_ratio: 0.8 # age fairness of being escalated (tier >= 2) among legitimate applicants
  # The *_buffered policies are chosen against capacities shrunk to this share (10% margin),
  # because fixed thresholds drift with the score distribution (report §4.4).
  capacity_buffer: 0.9

search:
  # Thresholds are placed at these alert rates (share of applications at or above the threshold).
  # Dense below the capacities (2% review, 10% verification) so the best feasible policy is
  # not pushed down to a coarse grid point; coarser above them.
  alert_rates: [
    0.001, 0.002, 0.003, 0.004, 0.005, 0.0075,
    0.01, 0.0125, 0.015, 0.0175, 0.02, 0.025, 0.03, 0.04,
    0.05, 0.055, 0.06, 0.065, 0.07, 0.075, 0.08, 0.085, 0.09, 0.095, 0.1,
    0.11, 0.12, 0.15, 0.2, 0.25, 0.3, 0.4, 0.5,
  ]

sensitivity: # one assumption changes at a time; the others stay at the values above
  loss_full_multipliers: [0.25, 4.0] # both losses together (keeps the 4:1 ratio)
  loss_limited_multipliers: [0.5, 2.0] # limited-account loss only: 25,000 / 100,000
  verify_catch: [0.3, 0.8]
  review_catch: [0.7, 0.95]
  cost_verify: [25, 150]
  cost_review: [150, 600]
  cost_friction: [500, 1000]
  cost_attrition: [1000, 5000]
  review_capacity_rate: [0.01, 0.05]
  verify_capacity_rate: [0.05, 0.2]
  scenarios: # several assumptions at once
    樂觀情境: { verify_catch: 0.8, loss_limited: 25000, cost_friction: 100, cost_attrition: 1000 }
    保守情境: { verify_catch: 0.3, loss_limited: 100000, cost_friction: 500, cost_attrition: 5000 }
